name: Omni Build
run-name: Omni build ${{ inputs.job }}

on:
  workflow_dispatch:
    inputs:
      job:
        description: "ID job dari bot"
        required: true
        type: string
      kind:
        description: "flutter atau android"
        required: true
        type: string
      root:
        description: "Folder project di dalam ZIP"
        required: false
        default: "."
        type: string
      mode:
        description: "debug atau release"
        required: false
        default: "release"
        type: string
      split:
        description: "Pisah APK per arsitektur (Flutter)"
        required: false
        default: "false"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB: ${{ inputs.job }}
      ROOT: ${{ inputs.root }}
      MODE: ${{ inputs.mode }}
      SPLIT: ${{ inputs.split }}

    steps:
      - name: Validasi input
        shell: bash
        run: |
          set -euo pipefail

          KIND_RAW="${{ inputs.kind }}"
          case "$KIND_RAW" in
            flutter|android) KIND="$KIND_RAW" ;;
            *) echo "::error::Kind ga valid: '$KIND_RAW' (harus 'flutter' atau 'android')"; exit 1 ;;
          esac

          case "$MODE" in
            debug|release) ;;
            *) echo "::error::Mode ga valid: '$MODE' (harus 'debug' atau 'release')"; exit 1 ;;
          esac

          if [ -z "$JOB" ]; then
            echo "::error::Job ID kosong"; exit 1
          fi
          if ! printf '%s' "$JOB" | grep -Eq '^[A-Za-z0-9_-]+$'; then
            echo "::error::Job ID ga valid: '$JOB' (cuma boleh huruf, angka, '_', '-')"; exit 1
          fi

          if [ -z "$ROOT" ]; then
            echo "::error::Folder project kosong"; exit 1
          fi
          case "$ROOT" in
            /*|*..*) echo "::error::Folder ga valid: '$ROOT'"; exit 1 ;;
          esac

          SPLIT_LC=$(printf '%s' "$SPLIT" | tr '[:upper:]' '[:lower:]')
          case "$SPLIT_LC" in
            true|1|yes|y) SPLIT_NORM=true ;;
            false|0|no|n|"") SPLIT_NORM=false ;;
            *) echo "::error::Split ga valid: '$SPLIT' (pakai true/false)"; exit 1 ;;
          esac

          if [ "$KIND" = "flutter" ] && ! printf '%s' "$ROOT" | grep -Eq '(^|/)pubspec\.yaml$|^\.$'; then
            echo "::warning::Kind=flutter tapi ROOT='$ROOT' ga ngacu ke folder ber-pubspec.yaml. Pastikan folder-nya bener."
          fi

          SAFE_ARTIFACT="apk-$(printf '%s' "$JOB" | sed 's/[^A-Za-z0-9._-]/_/g')"
          if [ "${#SAFE_ARTIFACT}" -gt 120 ]; then
            SAFE_ARTIFACT="apk-$(printf '%s' "$JOB" | md5sum | cut -c1-12)"
          fi

          {
            echo "KIND=$KIND"
            echo "SPLIT_NORM=$SPLIT_NORM"
            echo "SAFE_ARTIFACT=$SAFE_ARTIFACT"
          } >> "$GITHUB_ENV"

          echo "KIND=$KIND"
          echo "MODE=$MODE"
          echo "ROOT=$ROOT"
          echo "SPLIT_NORM=$SPLIT_NORM"
          echo "SAFE_ARTIFACT=$SAFE_ARTIFACT"

      - name: Ambil ZIP project
        uses: actions/checkout@v4

      - name: Ekstrak project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="jobs/$JOB/project.zip"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP ga ketemu: $ZIP_PATH"
            exit 1
          fi

          mkdir -p work
          unzip -q "$ZIP_PATH" -d work

          PROJECT_DIR="$GITHUB_WORKSPACE/work/$ROOT"
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "::error::Folder project ga ada setelah ekstrak: $PROJECT_DIR"
            echo "Isi work/:"
            find work -maxdepth 3 -type d | head -n 50
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        if: env.KIND == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter
        if: env.KIND == 'flutter'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          flutter pub get
          if [ "$SPLIT_NORM" = "true" ]; then
            flutter build apk "--$MODE" --split-per-abi
          else
            flutter build apk "--$MODE"
          fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          shopt -s nullglob
          APKS=(build/app/outputs/flutter-apk/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::Flutter ga ngasilin APK"
            exit 1
          fi
          for f in "${APKS[@]}"; do
            cp "$f" "$GITHUB_WORKSPACE/out/"
          done
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Setup Gradle
        if: env.KIND == 'android'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android
        if: env.KIND == 'android'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f ./gradlew ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          elif command -v gradle >/dev/null 2>&1; then
            echo "::warning::gradlew ga ada, fallback ke 'gradle'"
            GRADLE_CMD="gradle"
          else
            echo "::error::gradlew ga ada dan 'gradle' ga terpasang"
            exit 1
          fi

          if [ "$MODE" = "release" ]; then
            $GRADLE_CMD assembleRelease --no-daemon --stacktrace
          else
            $GRADLE_CMD assembleDebug --no-daemon --stacktrace
          fi

          mkdir -p "$GITHUB_WORKSPACE/out"
          shopt -s nullglob

          found=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *androidTest*|*test-*|*Test/*) continue ;;
            esac
            rel="${f#./}"
            name=$(printf '%s' "$rel" | sed 's|/|_|g')
            cp "$f" "$GITHUB_WORKSPACE/out/$name"
            found=1
          done < <(find . -path "*/build/outputs/apk/*" -name "*.apk" -print0)

          if [ "$found" -eq 0 ]; then
            echo "::error::Ga ada APK yang dihasilkan"
            exit 1
          fi

          ls -la "$GITHUB_WORKSPACE/out"

      - name: Cek hasil
        shell: bash
        run: |
          set -euo pipefail
          ls -la out || true
          if [ -z "$(ls out/*.apk 2>/dev/null || true)" ]; then
            echo "::error::Ga ada APK yang dihasilkan"
            exit 1
          fi
          echo "Total APK: $(ls out/*.apk | wc -l)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_ARTIFACT }}
          path: out/*.apk
          retention-days: 1
          
